<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Planner</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#141821;--mu:#6b7280;--ac:#2563eb;--ac2:#16a34a;--bd:#e3e7ee;--wa:#d97706;--rd:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b23;--tx:#eceef2;--mu:#98a0ae;--bd:#272c37;--ac:#5b9bff;--ac2:#4ade80;--wa:#fbbf24;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:21px;margin:2px 0 8px}h2{font-size:15px;margin:18px 0 8px}h3{font-size:15px;margin:0 0 4px}
.mu{color:var(--mu);font-size:13px}.b{font-weight:600}.pre{white-space:pre-wrap}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin:0}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:6px 10px;font-size:13px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row2>.btn{flex:1;text-align:center;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
details.key summary{cursor:pointer;font-weight:600}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;max-width:100%}
details.key input{width:100%}
nav{display:flex;gap:6px;margin:12px 0;position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.hc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.ring{width:110px}.rbg{fill:none;stroke:var(--bd);stroke-width:10}.rt{font-size:19px;font-weight:700;fill:var(--tx)}.rs{font-size:8.5px;fill:var(--mu)}
.ht{display:flex;flex-direction:column;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center}
.ti{font-size:22px;grid-row:span 2}.tb{min-width:0}.k{font-size:11.5px;color:var(--mu)}.v{font-size:21px;font-weight:700;line-height:1.15}.d{font-size:11.5px}
.sp{grid-column:1/-1;width:100%;height:22px}.up{color:var(--ac2)}.dn{color:var(--wa)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}.cols .card{margin:0}
svg{width:100%;height:auto;display:block}
.zb{display:flex;height:26px;border-radius:8px;overflow:hidden;color:#fff;font-size:11px;font-weight:700}.zb div{display:flex;align-items:center;justify-content:center}
.zl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mu);margin-top:4px}
.act{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}.act:first-child{border-top:0}
.chips{display:flex;gap:6px;margin:8px 0}.chips.wrap{flex-wrap:wrap}
.chip{flex:1;min-width:44px;padding:8px 2px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.chip.sm{flex:none;padding:6px 10px;flex-direction:row}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.r2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.rv{border-left:4px solid var(--ac)}
.day b{font-size:15px}.day.rest{opacity:.6}.ses{padding:8px 0;border-top:1px solid var(--bd);margin-top:6px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--ac);color:#fff;margin-right:6px}.tag.f{background:var(--ac2)}
.pc{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.pc span{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:3px 8px;font-size:12.5px}
.num{width:64px}.sr{width:92px}.ex{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}.ex select{flex:1;min-width:130px}
.lnk{background:none;border:0;color:var(--ac);font:inherit;font-size:13px;padding:2px 4px;cursor:pointer;text-decoration:underline}
.x{background:none;border:0;color:var(--rd);font-size:18px;cursor:pointer}
.body{max-width:340px;margin:6px auto 0}.body .base *{fill:var(--bg);stroke:var(--bd)}
.body [data-m]{fill:var(--bd);stroke:var(--mu);stroke-width:.6;cursor:pointer;transition:fill .15s}.body [data-m].on{fill:var(--ac);stroke:var(--ac)}
.body text{font-size:9px;fill:var(--mu)}
#pr{display:none}
@media print{body{background:#fff!important}main>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff;font-size:12px}#pr h1{font-size:18px}#pr .pd{break-inside:avoid;border-top:1px solid #999;padding:6px 0}#pr table{border-collapse:collapse;width:100%}#pr td,#pr th{border:1px solid #999;padding:3px 6px;text-align:left}}
</style></head><body><main>
<div class="top"><h1>🏃 Training Planner</h1><span class="mu" id="src">Dados de demonstração</span></div>
<div class="row2"><select id="per" title="Período a importar" style="flex:1"><option value="28">Importar 4 semanas</option><option value="84">Importar 12 semanas</option><option value="182">Importar 6 meses</option><option value="365">Importar 1 ano</option></select><button class="btn" id="gsync">⟳ Sincronizar</button><button class="btn s" id="gdiag">Diagnóstico</button><label class="btn s" style="margin:0">Importar JSON<input id="f" type="file" accept=".json" hidden></label></div>
<div id="gst" class="mu b"></div><div id="gm" class="mu pre"></div>
<details class="card key" style="margin-top:8px"><summary>🔐 Chave</summary>
<label>Token de acesso do Worker (APP_TOKEN)</label><input id="apik" type="password" autocomplete="off">
<label>Palavra-passe (opcional; vazio = sem palavra-passe)</label><input id="pp" type="password" autocomplete="off">
<label>URL do Worker (ou proxy local)</label><input id="purl" placeholder="https://o-teu-worker.workers.dev">
<div class="row2"><button class="btn s" id="gsave">Guardar cifrada</button><button class="btn s" id="gdel">Apagar</button></div></details>
<nav><button data-t="a" class="on">Visão global</button><button data-t="b">Plano</button><button data-t="c">Exercícios</button></nav>
<section id="a"></section><section id="b" hidden></section><section id="c" hidden></section>
<div id="pr"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const DN=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"],DL=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LIB0={"Quadríceps":["Agachamento livre","Leg press","Passada búlgara"],"Isquiotibiais":["Peso morto romeno","Leg curl","Nordic curl"],"Glúteos":["Hip thrust","Step-up","Abdução com banda"],"Gémeos":["Elevação de gémeos em pé","Elevação sentado","Saltos à corda"],"Peito":["Supino com halteres","Flexões","Crossover"],"Costas":["Remada com barra","Puxada ao peito","Remada unilateral"],"Ombros":["Press militar","Elevações laterais","Face pull"],"Bíceps":["Rosca direta","Rosca martelo"],"Tríceps":["Extensão no cabo","Fundos no banco"],"Core":["Prancha","Pallof press","Dead bug","Elevação de pernas"]};
const GR=Object.keys(LIB0);let CUS=ld("tp_lib",{});const lib=g=>(LIB0[g]||[]).concat(CUS[g]||[]);
const COMBO={TP:["Tronco + Pernas",["Peito","Costas","Core","Quadríceps","Isquiotibiais","Glúteos"]],TB:["Tronco + Braços",["Peito","Costas","Ombros","Bíceps","Tríceps","Core"]],BP:["Braços + Pernas",["Ombros","Bíceps","Tríceps","Quadríceps","Isquiotibiais","Gémeos"]],FB:["Corpo inteiro",["Quadríceps","Glúteos","Peito","Costas","Ombros","Core"]]};
const CAP={5:35,10:50,21:65,0:40};
let P=ld("tp_state",{runDays:[1,3,5],strDays:[0,2],types:{0:"TP",2:"BP"},goal:"10",ref:"",hist:{},week:null});const save=()=>sv("tp_state",P);
let D=demo(),CG="Quadríceps";
const pad=n=>String(n).padStart(2,"0");
const td=()=>{const t=new Date();return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())};
const addD=(i,n)=>{const x=new Date(i+"T12:00:00");x.setDate(x.getDate()+n);return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())};
const wk=i=>addD(i,-((new Date(i+"T12:00:00").getDay()+6)%7));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const fp=m=>{const s=Math.round(m*60);return Math.floor(s/60)+":"+pad(s%60)};
const parseP=t=>{const m=/^(\d+):(\d{2})$/.exec((t||"").trim());return m?+m[1]+m[2]/60:0};
const dm_=i=>i.slice(8)+"/"+i.slice(5,7);
const weekKm=w=>D.activities.filter(a=>a.type=="run"&&wk(a.date)==w).reduce((s,a)=>s+a.distance_km,0);
const weekStr=w=>D.activities.filter(a=>a.type=="strength"&&wk(a.date)==w).length;
const PN=()=>+ld("tp_dper",12);function setPer(v){sv("tp_dper",+v);renderA()}
function weeks(n){const c=wk(td()),o=[];for(let i=(n||12)-1;i>=0;i--){const k=addD(c,-7*i);o.push({k,km:weekKm(k),str:weekStr(k)})}return o}
function stats(){const N=PN(),W=weeks(2*N+1),dl=D.daily,l4=W.slice(-(N+1),-1),p4=W.slice(-(2*N+1),-(N+1)),b4=W.slice(-5,-1),v=(n,k)=>dl.slice(-n).map(x=>x[k]).filter(x=>x>0);
const r7=avg(v(7,"resting_hr")),r28=avg(v(28,"resting_hr")),h7=avg(v(7,"hrv")),h28=avg(v(28,"hrv")),sl=avg(v(7,"sleep_h")),bb=avg(v(7,"bb_max"));
const t28=addD(td(),-28),tN=addD(td(),-7*N),pc=t=>{const r=D.activities.filter(a=>a.type=="run"&&a.date>=t),d=r.reduce((s,a)=>s+a.distance_km,0);return{p:d?r.reduce((s,a)=>s+a.duration_min,0)/d:0,h:avg(r.map(a=>a.avg_hr).filter(x=>x>0))}},pn=pc(tN),p28=pc(t28),pace=pn.p,hr=pn.h;
let sc=null;if(r7||h7||sl||bb){sc=100;if(r28&&r7)sc-=Math.min(25,Math.max(0,(r7-r28)*5));if(h28&&h7)sc-=Math.min(30,Math.max(0,(1-h7/h28)*150));if(sl)sc-=Math.min(25,Math.max(0,(7.5-sl)*10));if(bb)sc-=Math.min(20,Math.max(0,(70-bb)*.5));sc=Math.round(sc)}
return{N,W,km4b:avg(b4.map(w=>w.km)),pace28:p28.p,km4:avg(l4.map(w=>w.km)),kmp:avg(p4.map(w=>w.km)),str4:avg(l4.map(w=>w.str)),r7,r28,h7,h28,sl,bb,pace,hr,sc}}

/* ---------- gráficos ---------- */
const spark=(v,c)=>{v=v.filter(x=>x>0);if(v.length<2)return"";const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;return`<svg viewBox="0 0 64 22" class="sp"><polyline points="${v.map((y,i)=>(i/(v.length-1)*62+1)+","+(20-(y-mn)/r*18)).join(" ")}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`};
const ring=(p,c,t,s)=>{const R=40,C=2*Math.PI*R,f=Math.max(0,Math.min(1,p))*C;return`<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" class="rbg"/><circle cx="50" cy="50" r="${R}" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${f} ${C}" transform="rotate(-90 50 50)"/><text x="50" y="52" text-anchor="middle" class="rt">${t}</text><text x="50" y="65" text-anchor="middle" class="rs">${s}</text></svg></div>`};
const tile=(i,k,v,d,c,sp)=>`<div class="tile"><div class="ti">${i}</div><div class="tb"><div class="k">${k}</div><div class="v">${v}</div><div class="d ${c||""}">${d||""}</div></div>${sp||""}</div>`;
const bars=(v,l,c,fmt)=>{const mx=Math.max(...v,1),w=300/v.length,n=v.length-1;return`<svg viewBox="0 0 300 120">${v.map((y,i)=>{const h=y/mx*78;return`<rect x="${i*w+w*.12}" y="${92-h}" width="${w*.76}" height="${Math.max(h,1)}" rx="4" fill="${c}" opacity="${i==n?1:.45}"/><text x="${i*w+w/2}" y="${88-h}" font-size="9" text-anchor="middle" fill="currentColor">${y&&v.length<=16?(fmt?fmt(y):y):""}</text><text x="${i*w+w/2}" y="108" font-size="7.5" text-anchor="middle" fill="currentColor" opacity=".6">${(n-i)%Math.ceil(v.length/7)==0?l[i]:""}</text>`}).join("")}</svg>`};
const line=(v,c,u)=>{v=v.filter(x=>x>0);if(v.length<2)return"";const mn=Math.min(...v)-1,mx=Math.max(...v)+1,p=v.map((y,i)=>[+(i/(v.length-1)*290+5).toFixed(1),+(92-(y-mn)/(mx-mn)*72).toFixed(1)]),pt=p.map(a=>a.join(",")).join(" "),z=p[p.length-1];return`<svg viewBox="0 0 300 112"><polygon points="5,95 ${pt} 295,95" fill="${c}" opacity=".15"/><polyline points="${pt}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${z[0]}" cy="${z[1]}" r="4" fill="${c}"/><text x="5" y="109" font-size="8" fill="currentColor" opacity=".6">min ${Math.round(mn+1)} · máx ${Math.round(mx-1)} ${u}</text></svg>`};
function zonesBar(){const z=D.hr_zones;if(!z||!z.zone1Floor)return"";const f=[1,2,3,4,5].map(i=>z["zone"+i+"Floor"]),mx=z.maxHeartRateUsed||f[4]+15,cl=["#94a3b8","#22c55e","#eab308","#f97316","#ef4444"],tot=mx-f[0];return`<h2>Zonas de frequência cardíaca</h2><div class="card"><div class="zb">${f.map((x,i)=>`<div style="flex:${((f[i+1]||mx)-x)/tot};background:${cl[i]}">Z${i+1}</div>`).join("")}</div><div class="zl">${f.map((x,i)=>`<span>${x}–${f[i+1]||mx}</span>`).join("")}</div></div>`}

/* ---------- visão global ---------- */
function renderA(){const s=stats(),N=s.N,W=s.W.slice(-N),cur=wk(td()),pl=P.hist[cur],done=weekKm(cur),dk=s.kmp?(s.km4/s.kmp-1)*100:0,sc=s.sc;
const scC=sc==null?"var(--mu)":sc>=80?"var(--ac2)":sc>=60?"var(--wa)":"var(--rd)",scT=sc==null?"sem dados":sc>=80?"boa":sc>=60?"moderada":"baixa",L=(n,k)=>D.daily.slice(-n).map(x=>x[k]);
const l1=line(L(N*7,"resting_hr"),"var(--wa)","bpm"),l2=line(L(N*7,"hrv"),"var(--ac2)","ms"),lab=W.map(w=>dm_(w.k));
const ds=D.activities.map(a=>a.date).concat(D.daily.map(x=>x.date)).sort(),have=ds.length?Math.round((new Date(td()+"T12:00")-new Date(ds[0]+"T12:00"))/864e5):0,cov=(ds.length?"Dados de "+ds[0].split("-").reverse().join("/")+" a "+ds[ds.length-1].split("-").reverse().join("/"):"Sem dados")+" · treino: últimas "+N+" semanas · recuperação: 7 dias vs média de 28"+(have<N*7*.9?" · ⚠ importa um período maior para preencher o painel":"");
$("#a").innerHTML=`<div class="r2"><span class="b">Período do painel</span><select onchange="setPer(this.value)">${[[4,"4 semanas"],[12,"12 semanas"],[26,"6 meses"],[52,"1 ano"]].map(([v,t])=>`<option value="${v}" ${N==v?"selected":""}>${t}</option>`).join("")}</select></div><div class="mu" style="margin-bottom:8px">${cov}</div><div class="hero"><div class="hc">${ring(sc==null?0:sc/100,scC,sc==null?"–":sc,"prontidão")}<div class="ht"><b>Recuperação ${scT}</b><span class="mu">FC repouso, HRV, sono, body battery</span></div></div>
<div class="hc">${ring(pl?done/pl.km:0,"var(--ac)",done.toFixed(0)+" km",pl?"de "+pl.km.toFixed(0)+" km":"esta semana")}<div class="ht"><b>Semana atual</b><span class="mu">${pl?Math.round(done/pl.km*100)+"% do plano":"sem plano gerado"}</span></div></div></div>
<div class="tiles">${tile("🏃","Km / semana",s.km4.toFixed(1),(dk>=0?"▲ ":"▼ ")+Math.abs(dk).toFixed(0)+"% vs "+N+" sem. anteriores",dk>=0?"up":"dn",spark(W.map(w=>w.km),"var(--ac)"))}
${tile("⏱","Ritmo médio",s.pace?fp(s.pace)+" /km":"–","média das últimas "+N+" sem.")}
${tile("❤️","FC repouso",s.r7?s.r7.toFixed(0)+" bpm":"–",s.r28?"média 28d: "+s.r28.toFixed(0):"sem dados",s.r28&&s.r7-s.r28>2?"dn":"up",spark(L(N*7,"resting_hr"),"var(--wa)"))}
${tile("💓","HRV",s.h7?s.h7.toFixed(0)+" ms":"–",s.h28?"média 28d: "+s.h28.toFixed(0):"sem dados",s.h28&&s.h7<s.h28*.93?"dn":"up",spark(L(N*7,"hrv"),"var(--ac2)"))}
${tile("😴","Sono",s.sl?s.sl.toFixed(1)+" h":"–",s.sl&&s.sl<7?"abaixo de 7 h":"últimos 7 dias",s.sl&&s.sl<7?"dn":"up",spark(L(N*7,"sleep_h"),"var(--ac)"))}
${tile("🔋","Body battery",s.bb?s.bb.toFixed(0):"–","pico médio 7 d",s.bb&&s.bb<60?"dn":"up",spark(L(N*7,"bb_max"),"var(--ac2)"))}
${tile("🏋","Força / semana",s.str4.toFixed(1),"sessões/sem. (média de "+N+" sem.)","",spark(W.map(w=>w.str),"var(--ac2)"))}
${tile("🫀","FC média corrida",s.hr?s.hr.toFixed(0)+" bpm":"–","média das últimas "+N+" sem.")}</div>
<h2>Últimas ${N} semanas</h2><div class="cols"><div class="card"><div class="k">Quilómetros por semana</div>${bars(W.map(w=>w.km),lab,"var(--ac)",y=>Math.round(y))}</div><div class="card"><div class="k">Sessões de força por semana</div>${bars(W.map(w=>w.str),lab,"var(--ac2)")}</div>
${l1?`<div class="card"><div class="k">FC de repouso (30 dias)</div>${l1}</div>`:""}${l2?`<div class="card"><div class="k">HRV (30 dias)</div>${l2}</div>`:""}</div>
${zonesBar()}<h2>Últimas atividades</h2><div class="card">${D.activities.slice(-6).reverse().map(a=>`<div class="act"><span style="font-size:20px">${a.type=="run"?"🏃":"🏋"}</span><div><b>${a.type=="run"?a.distance_km+" km":"Força"}</b> <span class="mu">${a.date} · ${a.duration_min} min${a.type=="run"&&a.duration_min&&a.distance_km?" · "+fp(a.duration_min/a.distance_km)+" /km":""}${a.avg_hr?" · "+a.avg_hr+" bpm":""}</span></div></div>`).join("")}</div>`}

/* ---------- boneco muscular ---------- */
const BODY=`<svg viewBox="0 0 300 266" class="body"><g class="base"><circle cx="75" cy="20" r="13"/><circle cx="225" cy="20" r="13"/><rect x="66" y="31" width="18" height="10" rx="4"/><rect x="216" y="31" width="18" height="10" rx="4"/><rect x="52" y="40" width="46" height="92" rx="14"/><rect x="202" y="40" width="46" height="92" rx="14"/><rect x="24" y="48" width="18" height="84" rx="8"/><rect x="108" y="48" width="18" height="84" rx="8"/><rect x="174" y="48" width="18" height="84" rx="8"/><rect x="258" y="48" width="18" height="84" rx="8"/><rect x="55" y="134" width="18" height="122" rx="8"/><rect x="77" y="134" width="18" height="122" rx="8"/><rect x="205" y="134" width="18" height="122" rx="8"/><rect x="227" y="134" width="18" height="122" rx="8"/></g>
<g data-m="Ombros"><ellipse cx="43" cy="52" rx="12" ry="9"/><ellipse cx="107" cy="52" rx="12" ry="9"/><ellipse cx="193" cy="52" rx="12" ry="9"/><ellipse cx="257" cy="52" rx="12" ry="9"/></g>
